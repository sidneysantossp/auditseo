<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRM + Project Management | AUDITSEO</title>
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Crimson+Pro:wght@300;400;600;700&family=JetBrains+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<style>
:root{--bg-dark:#0a0a0a;--bg-card:#111;--bg-card-hover:#1a1a1a;--bg-input:#1a1a1a;--border:#222;--border-light:#333;--text-primary:#fff;--text-secondary:#aaa;--text-muted:#666;--accent-red:#e63946;--accent-gold:#d4a574;--accent-cyan:#00d4ff;--accent-green:#22c55e;--accent-purple:#a855f7;--accent-orange:#f97316;--accent-blue:#3b82f6;--accent-yellow:#eab308;--gradient-fire:linear-gradient(135deg,#e63946,#d4a574);--gradient-cyan:linear-gradient(135deg,#00d4ff,#a855f7);--font-display:'Bebas Neue',cursive;--font-body:'Crimson Pro',serif;--font-mono:'JetBrains Mono',monospace;--radius:12px;--radius-sm:8px;--shadow:0 4px 24px rgba(0,0,0,.4);--transition:.25s cubic-bezier(.4,0,.2,1)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:14px;scroll-behavior:smooth}
body{font-family:var(--font-body);background:var(--bg-dark);color:var(--text-primary);min-height:100vh;overflow-x:hidden}
a{color:var(--accent-cyan);text-decoration:none}a:hover{text-decoration:underline}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-track{background:var(--bg-dark)}::-webkit-scrollbar-thumb{background:var(--border-light);border-radius:3px}

/* LOGIN */
#login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px}
.login-box{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:48px 40px;width:100%;max-width:420px;box-shadow:var(--shadow);text-align:center}
.login-box h1{font-family:var(--font-display);font-size:2.4rem;background:var(--gradient-fire);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px}
.login-box p{color:var(--text-secondary);margin-bottom:32px}
.login-box label{display:block;text-align:left;color:var(--text-secondary);font-family:var(--font-mono);font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.login-box input{width:100%;padding:12px 16px;background:var(--bg-input);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text-primary);font-family:var(--font-body);font-size:1rem;margin-bottom:20px}
.login-box input:focus{outline:none;border-color:var(--accent-cyan)}
.login-box button{width:100%;padding:14px;background:var(--gradient-fire);border:none;border-radius:var(--radius-sm);color:#fff;font-family:var(--font-display);font-size:1.3rem;cursor:pointer}
.login-box button:hover{opacity:.9}
.login-error{color:var(--accent-red);font-size:.9rem;margin-top:12px;display:none}

/* LAYOUT */
#app{display:none}#app.active{display:flex;min-height:100vh}
.sidebar{width:220px;min-height:100vh;background:var(--bg-card);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;left:0;z-index:100;overflow-y:auto}
.sidebar-brand{padding:20px 16px;border-bottom:1px solid var(--border)}
.sidebar-brand h2{font-family:var(--font-display);font-size:1.4rem;background:var(--gradient-fire);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sidebar-brand span{font-family:var(--font-mono);font-size:.65rem;color:var(--text-muted)}
.sidebar-section{padding:8px 0}
.sidebar-section-title{font-family:var(--font-mono);font-size:.62rem;text-transform:uppercase;letter-spacing:.08em;color:var(--text-muted);padding:8px 16px 4px}
.sidebar-nav a{display:flex;align-items:center;gap:10px;padding:9px 16px;color:var(--text-secondary);font-family:var(--font-mono);font-size:.76rem;border-left:3px solid transparent;cursor:pointer;transition:all var(--transition);text-decoration:none}
.sidebar-nav a:hover,.sidebar-nav a.active{color:var(--text-primary);background:rgba(255,255,255,.03);border-left-color:var(--accent-red)}
.sidebar-nav a .icon{font-size:1rem;width:20px;text-align:center}
.sidebar-user{padding:12px 16px;border-top:1px solid var(--border);font-family:var(--font-mono);font-size:.72rem;color:var(--text-muted);margin-top:auto}
.sidebar-user strong{color:var(--text-primary);display:block;margin-bottom:2px}
.sidebar-user .logout-btn{color:var(--accent-red);cursor:pointer;margin-top:6px;display:inline-block}
.main{flex:1;margin-left:220px;padding:28px;min-height:100vh}
.mobile-toggle{display:none;position:fixed;top:12px;left:12px;z-index:200;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:6px 10px;color:var(--text-primary);font-size:1.1rem;cursor:pointer}
@media(max-width:860px){.sidebar{transform:translateX(-100%);transition:transform .25s}.sidebar.open{transform:translateX(0)}.mobile-toggle{display:block}.main{margin-left:0;padding:20px 14px;padding-top:56px}}

/* COMMON */
.page{display:none}.page.active{display:block}
.page-header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:24px}
.page-header h1{font-family:var(--font-display);font-size:1.8rem;background:var(--gradient-fire);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border:none;border-radius:var(--radius-sm);font-family:var(--font-mono);font-size:.75rem;cursor:pointer;transition:all var(--transition);text-transform:uppercase;letter-spacing:.04em}
.btn-primary{background:var(--gradient-fire);color:#fff}.btn-primary:hover{opacity:.9}
.btn-secondary{background:var(--bg-input);color:var(--text-primary);border:1px solid var(--border)}.btn-secondary:hover{border-color:var(--accent-cyan)}
.btn-danger{background:var(--accent-red);color:#fff}.btn-danger:hover{opacity:.85}
.btn-success{background:var(--accent-green);color:#fff}
.btn-sm{padding:5px 12px;font-size:.68rem}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:24px}
.kpi-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;position:relative;overflow:hidden}
.kpi-card:hover{border-color:var(--border-light)}
.kpi-card .kpi-label{font-family:var(--font-mono);font-size:.65rem;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);margin-bottom:6px}
.kpi-card .kpi-value{font-family:var(--font-display);font-size:1.8rem;background:var(--gradient-fire);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.kpi-card .kpi-sub{font-family:var(--font-mono);font-size:.65rem;color:var(--text-muted);margin-top:3px}
.section-title{font-family:var(--font-display);font-size:1.3rem;color:var(--text-primary);margin-bottom:14px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.table-container{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);overflow-x:auto;margin-bottom:24px}
.table-container table{width:100%;border-collapse:collapse}
.table-container th{font-family:var(--font-mono);font-size:.68rem;text-transform:uppercase;letter-spacing:.04em;color:var(--text-muted);text-align:left;padding:12px 14px;border-bottom:1px solid var(--border);white-space:nowrap}
.table-container td{padding:10px 14px;border-bottom:1px solid var(--border);font-size:.85rem;color:var(--text-secondary)}
.table-container tr:last-child td{border-bottom:none}
.table-container tr:hover td{background:rgba(255,255,255,.02)}
.filters{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:20px;align-items:center}
.filters select,.filters input{padding:7px 12px;background:var(--bg-input);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text-primary);font-family:var(--font-mono);font-size:.75rem}
.filters select:focus,.filters input:focus{outline:none;border-color:var(--accent-cyan)}
.status-badge{font-family:var(--font-mono);font-size:.65rem;padding:2px 8px;border-radius:8px;text-transform:uppercase;letter-spacing:.03em}
.status-novo{background:rgba(59,130,246,.15);color:#3b82f6}.status-contato{background:rgba(249,115,22,.15);color:#f97316}.status-reuniao{background:rgba(168,85,247,.15);color:#a855f7}.status-proposta{background:rgba(0,212,255,.15);color:#00d4ff}.status-fechado{background:rgba(34,197,94,.15);color:#22c55e}.status-perdido{background:rgba(230,57,70,.15);color:#e63946}
.priority-alta{background:rgba(230,57,70,.2);color:var(--accent-red);padding:2px 8px;border-radius:4px;font-size:.62rem;font-family:var(--font-mono);text-transform:uppercase}.priority-media{background:rgba(249,115,22,.2);color:var(--accent-orange);padding:2px 8px;border-radius:4px;font-size:.62rem;font-family:var(--font-mono);text-transform:uppercase}.priority-baixa{background:rgba(59,130,246,.2);color:var(--accent-blue);padding:2px 8px;border-radius:4px;font-size:.62rem;font-family:var(--font-mono);text-transform:uppercase}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:500;padding:20px}
.modal-overlay.active{display:flex}
.modal{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);width:100%;max-width:600px;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow)}
.modal.wide{max-width:800px}.modal.x-wide{max-width:1000px}
.modal-header{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.modal-header h2{font-family:var(--font-display);font-size:1.3rem;background:var(--gradient-fire);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.modal-close{background:none;border:none;color:var(--text-muted);font-size:1.2rem;cursor:pointer}
.modal-close:hover{color:var(--text-primary)}
.modal-body{padding:22px}
.modal-footer{padding:14px 22px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-family:var(--font-mono);font-size:.68rem;text-transform:uppercase;letter-spacing:.04em;color:var(--text-muted);margin-bottom:5px}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:9px 12px;background:var(--bg-input);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text-primary);font-family:var(--font-body);font-size:.9rem}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:none;border-color:var(--accent-cyan)}
.form-group textarea{resize:vertical;min-height:70px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:500px){.form-row{grid-template-columns:1fr}}

/* TOAST */
.toast-container{position:fixed;bottom:20px;right:20px;z-index:600;display:flex;flex-direction:column;gap:6px}
.toast{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 18px;font-family:var(--font-mono);font-size:.76rem;color:var(--text-primary);box-shadow:var(--shadow);animation:toastIn .3s ease}
.toast.success{border-left:3px solid var(--accent-green)}.toast.error{border-left:3px solid var(--accent-red)}.toast.info{border-left:3px solid var(--accent-cyan)}.toast.warning{border-left:3px solid var(--accent-orange)}
@keyframes toastIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

/* KANBAN */
.kanban-board{display:grid;gap:14px;margin-bottom:28px;overflow-x:auto;padding-bottom:8px}
.kanban-board.cols-6{grid-template-columns:repeat(6,1fr)}
.kanban-board.cols-5{grid-template-columns:repeat(5,1fr)}
@media(max-width:1200px){.kanban-board{grid-template-columns:repeat(3,minmax(220px,1fr))!important}}
@media(max-width:768px){.kanban-board{grid-template-columns:1fr!important}}
.kanban-col{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);min-height:350px;display:flex;flex-direction:column;overflow:hidden}
.kanban-col-header{padding:12px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.kanban-col-header .col-title{font-family:var(--font-mono);font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;display:flex;align-items:center;gap:6px}
.kanban-col-header .col-dot{width:8px;height:8px;border-radius:50%}
.kanban-col-header .col-count{font-family:var(--font-mono);font-size:.65rem;background:var(--bg-input);padding:1px 6px;border-radius:8px;color:var(--text-muted)}
.kanban-col-body{flex:1;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:80px}
.kanban-col-body.drag-over{background:rgba(255,255,255,.02)}
.kanban-card{background:var(--bg-card-hover);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px;cursor:grab;position:relative;transition:all var(--transition)}
.kanban-card:hover{border-color:var(--border-light);transform:translateY(-1px)}
.kanban-card.dragging{opacity:.5}
.kanban-card .card-company{font-family:var(--font-mono);font-size:.78rem;font-weight:600;color:var(--text-primary);margin-bottom:3px}
.kanban-card .card-contact{font-size:.76rem;color:var(--text-secondary);margin-bottom:6px}
.kanban-card .card-meta{display:flex;justify-content:space-between;align-items:center;font-family:var(--font-mono);font-size:.64rem;color:var(--text-muted)}
.kanban-card .card-value{color:var(--accent-green);font-weight:600}
.kanban-card .card-service{font-family:var(--font-mono);font-size:.62rem;color:var(--text-muted);margin-top:5px;padding-top:5px;border-top:1px solid var(--border)}
.kanban-card .card-actions{position:absolute;top:6px;right:6px;display:flex;gap:3px;opacity:0;transition:opacity var(--transition)}
.kanban-card:hover .card-actions{opacity:1}
.card-actions button{background:var(--bg-input);border:1px solid var(--border);border-radius:4px;width:22px;height:22px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-muted);font-size:.65rem}
.card-actions button:hover{border-color:var(--accent-cyan);color:var(--text-primary)}
.kanban-card .card-followup{font-family:var(--font-mono);font-size:.58rem;margin-top:4px;padding:2px 5px;border-radius:3px;display:inline-block}
.followup-overdue{background:rgba(230,57,70,.2);color:var(--accent-red)}.followup-today{background:rgba(249,115,22,.2);color:var(--accent-orange)}.followup-upcoming{background:rgba(59,130,246,.15);color:var(--accent-blue)}

/* CHARTS */
.chart-container{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:24px}
.chart-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:24px}
@media(max-width:900px){.chart-row{grid-template-columns:1fr}}
.chart-container h3{font-family:var(--font-mono);font-size:.78rem;text-transform:uppercase;letter-spacing:.04em;color:var(--text-muted);margin-bottom:14px}
.chart-container canvas{max-height:280px}

/* PROGRESS BAR */
.progress-bar{width:100%;height:7px;background:var(--bg-input);border-radius:4px;margin-top:8px;overflow:hidden}
.progress-bar .progress-fill{height:100%;border-radius:4px;transition:width .5s;background:var(--gradient-fire)}
.progress-bar .progress-fill.green{background:var(--accent-green)}.progress-bar .progress-fill.cyan{background:var(--accent-cyan)}

/* CONTRACT DOC */
.contract-doc{background:#fff;color:#111;padding:40px;border-radius:var(--radius);font-family:'Crimson Pro',serif;font-size:14px;line-height:1.7;max-width:800px;margin:0 auto}
.contract-doc h1{font-family:var(--font-display);font-size:2rem;color:#e63946;text-align:center;margin-bottom:8px}
.contract-doc .doc-subtitle{text-align:center;color:#666;font-size:.9rem;margin-bottom:30px}
.contract-doc h2{font-size:1.1rem;color:#e63946;margin:24px 0 8px;border-bottom:1px solid #ddd;padding-bottom:4px}
.contract-doc table{width:100%;border-collapse:collapse;margin:12px 0}
.contract-doc table td{padding:6px 10px;border:1px solid #ddd;font-size:.9rem}
.contract-doc table td:first-child{font-weight:600;width:35%;background:#f9f9f9}
.contract-doc .signature-area{display:flex;justify-content:space-between;margin-top:50px;padding-top:20px}
.contract-doc .sig-block{text-align:center;width:45%}
.contract-doc .sig-line{border-top:1px solid #111;margin-top:60px;padding-top:6px;font-size:.85rem}
@media print{body *{display:none!important}.contract-doc,.contract-doc *{display:block!important}.contract-doc{padding:20px;box-shadow:none;border:none}}

/* PROJECT KANBAN TASK */
.task-card{background:var(--bg-card-hover);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px;margin-bottom:6px;cursor:pointer;transition:all var(--transition)}
.task-card:hover{border-color:var(--border-light)}
.task-card .task-title{font-family:var(--font-mono);font-size:.74rem;font-weight:600;color:var(--text-primary);margin-bottom:4px}
.task-card .task-desc{font-size:.72rem;color:var(--text-muted);margin-bottom:6px}
.task-card .task-meta{display:flex;justify-content:space-between;align-items:center;font-family:var(--font-mono);font-size:.6rem;color:var(--text-muted)}
.task-card .task-assigned{color:var(--accent-cyan)}
.task-phase-badge{font-family:var(--font-mono);font-size:.58rem;padding:2px 6px;border-radius:4px;text-transform:uppercase}
.phase-audit{background:rgba(59,130,246,.15);color:#3b82f6}
.phase-strategy{background:rgba(168,85,247,.15);color:#a855f7}
.phase-exec{background:rgba(0,212,255,.15);color:#00d4ff}
.phase-monitor{background:rgba(34,197,94,.15);color:#22c55e}

/* META CARD */
.meta-overview{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:24px}
.meta-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:18px}
.meta-card .meta-label{font-family:var(--font-mono);font-size:.65rem;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);margin-bottom:6px}
.meta-card .meta-value{font-family:var(--font-display);font-size:1.6rem;background:var(--gradient-fire);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.meta-card .meta-sub{font-family:var(--font-mono);font-size:.65rem;color:var(--text-muted);margin-top:3px}
.monthly-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:24px}
.month-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px;text-align:center}
.month-card .month-name{font-family:var(--font-mono);font-size:.68rem;color:var(--text-muted);text-transform:uppercase;margin-bottom:4px}
.month-card .month-realized{font-family:var(--font-display);font-size:1.2rem;color:var(--accent-green)}
.month-card .month-target{font-family:var(--font-mono);font-size:.64rem;color:var(--text-muted)}
.service-goals{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-bottom:24px}
.service-goal-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:18px}
.service-goal-card h3{font-family:var(--font-mono);font-size:.78rem;margin-bottom:10px;color:var(--text-primary)}
.users-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.user-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;display:flex;flex-direction:column;gap:6px}
.user-card .user-name{font-family:var(--font-display);font-size:1.2rem}.user-card .user-role{font-family:var(--font-mono);font-size:.68rem;text-transform:uppercase;color:var(--accent-gold)}.user-card .user-login{font-family:var(--font-mono);font-size:.74rem;color:var(--text-muted)}
.auto-contract-banner{background:linear-gradient(135deg,rgba(34,197,94,.1),rgba(0,212,255,.05));border:1px solid rgba(34,197,94,.3);border-radius:var(--radius);padding:14px 18px;margin-bottom:18px;display:flex;align-items:center;gap:10px;font-family:var(--font-mono);font-size:.76rem;color:var(--accent-green)}

/* CLIENT PORTAL METRICS */
.client-metric-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin-bottom:24px}
.client-metric-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:18px}
.client-metric-card h4{font-family:var(--font-mono);font-size:.74rem;color:var(--text-muted);text-transform:uppercase;margin-bottom:10px}
.result-item{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);font-family:var(--font-mono);font-size:.74rem}
.result-item:last-child{border-bottom:none}
.result-item .ri-label{color:var(--text-secondary)}.result-item .ri-value{color:var(--accent-green);font-weight:600}
.result-item .ri-trend-up{color:var(--accent-green)}.result-item .ri-trend-down{color:var(--accent-red)}

/* Metas config inputs */
.mi-field{width:100%;padding:7px 9px;background:var(--bg-input);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text-primary);font-family:var(--font-mono);font-size:.76rem}
.mi-field:focus{outline:none;border-color:var(--accent-cyan)}
.mi-label{font-family:var(--font-mono);font-size:.64rem;color:var(--text-muted);display:block;margin-bottom:3px}
.metas-grid-12{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px}
.metas-grid-services{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}

/* TABS */
.tabs{display:flex;gap:4px;margin-bottom:20px;border-bottom:1px solid var(--border);padding-bottom:0}
.tab-btn{padding:8px 16px;font-family:var(--font-mono);font-size:.74rem;color:var(--text-muted);background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;transition:all var(--transition)}
.tab-btn:hover{color:var(--text-secondary)}
.tab-btn.active{color:var(--accent-cyan);border-bottom-color:var(--accent-cyan)}
.tab-content{display:none}.tab-content.active{display:block}

/* TIMELINE */
.timeline{position:relative;padding-left:24px}
.timeline::before{content:'';position:absolute;left:8px;top:0;bottom:0;width:2px;background:var(--border)}
.timeline-item{position:relative;margin-bottom:16px;padding-left:16px}
.timeline-item::before{content:'';position:absolute;left:-20px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--accent-cyan);border:2px solid var(--bg-dark)}
.timeline-item.done::before{background:var(--accent-green)}
.timeline-item.active-step::before{background:var(--accent-orange);box-shadow:0 0 8px rgba(249,115,22,.4)}
.timeline-item .tl-date{font-family:var(--font-mono);font-size:.64rem;color:var(--text-muted)}
.timeline-item .tl-title{font-family:var(--font-mono);font-size:.78rem;color:var(--text-primary);font-weight:600}
.timeline-item .tl-desc{font-size:.76rem;color:var(--text-secondary)}
</style>
</head>

function renderDashboard(){
var leads=getLeads(),contracts=getContracts(),active=[],mrr=0;
for(var i=0;i<contracts.length;i++){if(contracts[i].status==='ativo'){active.push(contracts[i]);mrr+=Number(contracts[i].valor||0);}}
var total=leads.length,pipe=0,closed=[],meetings=0;
for(var i=0;i<leads.length;i++){var l=leads[i];if(l.status!=='fechado'&&l.status!=='perdido')pipe+=Number(l.valor||0);if(l.status==='fechado')closed.push(l);if(l.status==='reuniao')meetings++;}
var conv=total>0?((closed.length/total)*100).toFixed(1):'0';
var projects=getProjects(),activePrj=projects.filter(function(p){return p.status==='ativo'});
G('dashboard-kpis').innerHTML='<div class="kpi-card"><div class="kpi-label">Leads</div><div class="kpi-value">'+total+'</div></div><div class="kpi-card"><div class="kpi-label">Pipeline</div><div class="kpi-value">'+fmt(pipe)+'</div></div><div class="kpi-card"><div class="kpi-label">Conversão</div><div class="kpi-value">'+conv+'%</div></div><div class="kpi-card"><div class="kpi-label">MRR</div><div class="kpi-value">'+fmt(mrr)+'</div><div class="kpi-sub">'+active.length+' contratos</div></div><div class="kpi-card"><div class="kpi-label">Projetos Ativos</div><div class="kpi-value">'+activePrj.length+'</div></div>';

var fh='';if(!alerts.length)fh='<div style="font-family:var(--font-mono);font-size:.76rem;color:var(--text-muted);padding:10px">Nenhum follow-up pendente.</div>';
else for(var i=0;i<alerts.length;i++){var a=alerts[i],l=a.lead,bc=a.type==='overdue'?'var(--accent-red)':a.type==='today'?'var(--accent-orange)':'var(--accent-blue)',cls=a.type==='overdue'?'followup-overdue':a.type==='today'?'followup-today':'followup-upcoming';fh+='<div style="display:flex;align-items:center;gap:12px;padding:8px 12px;margin-bottom:6px;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-sm);border-left:3px solid '+bc+';cursor:pointer" data-edit-lead="'+l.id+'"><span style="font-family:var(--font-mono);font-size:.76rem;font-weight:600;color:var(--text-primary)">'+l.empresa+'</span><span style="font-family:var(--font-mono);font-size:.66rem;color:var(--text-muted)">'+STAT[l.status]+' · '+(SVC[l.servico]||'')+'</span><span style="margin-left:auto;font-family:var(--font-mono);font-size:.68rem" class="'+cls+'">'+(a.type==='overdue'?'Atrasado '+Math.abs(a.diff)+'d':a.type==='today'?'Hoje':'em '+a.diff+'d')+'</span></div>';}
G('dashboard-followups').innerHTML=fh;
G('funnel-kpis').innerHTML='<div class="kpi-card"><div class="kpi-label">ARR</div><div class="kpi-value">'+fmt(mrr*12)+'</div></div><div class="kpi-card"><div class="kpi-label">Ticket Médio</div><div class="kpi-value">'+fmt(active.length>0?mrr/active.length:0)+'</div></div><div class="kpi-card"><div class="kpi-label">Reuniões</div><div class="kpi-value">'+meetings+'</div></div>';
// Charts
var metas=getMetas(),cm=new Date().getMonth();
destroyChart('mrr');var mrrD=[];for(var i=0;i<12;i++)mrrD.push(i<=cm?mrr:null);
charts['mrr']=new Chart(G('chart-mrr'),{type:'line',data:{labels:MO,datasets:[{label:'MRR',data:mrrD,borderColor:'#22c55e',backgroundColor:'rgba(34,197,94,.1)',fill:true,tension:.3},{label:'Meta',data:metas.monthly,borderColor:'#e63946',borderDash:[6,4],backgroundColor:'transparent',tension:.3,pointRadius:0}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:'#aaa',font:{family:'JetBrains Mono',size:10}}}},scales:{x:{ticks:{color:'#666',font:{family:'JetBrains Mono',size:9}},grid:{color:'#222'}},y:{ticks:{color:'#666',font:{family:'JetBrains Mono',size:9},callback:function(v){return 'R$'+v/1000+'k'}},grid:{color:'#222'}}}}});
destroyChart('leads-status');var sc={novo:0,contato:0,reuniao:0,proposta:0,fechado:0,perdido:0};for(var i=0;i<leads.length;i++)sc[leads[i].status]++;

}

   ═══════════════════════════════════════ */

function renderKanban(){

G('btn-save-task').addEventListener('click',saveTask);
G('btn-save-result').addEventListener('click',saveResult);

var closeBtns=Q('[data-close]');for(var i=0;i<closeBtns.length;i++){closeBtns[i].addEventListener('click',function(){closeModal(this.getAttribute('data-close'));});}
var overlays=Q('.modal-overlay');for(var i=0;i<overlays.length;i++){overlays[i].addEventListener('click',function(e){if(e.target===this)this.classList.remove('active');});}
document.addEventListener('keydown',function(e){if(e.key==='Escape'){var m=Q('.modal-overlay.active');for(var i=0;i<m.length;i++)m[i].classList.remove('active');}});

['filter-sdr','filter-service','filter-priority'].forEach(function(id){var el=G(id);if(el)el.addEventListener('change',renderKanban);});
var fs=G('filter-search');if(fs)fs.addEventListener('input',renderKanban);
var tfs=G('tbl-f-status');if(tfs)tfs.addEventListener('change',renderTable);
var tfsq=G('tbl-f-search');if(tfsq)tfsq.addEventListener('input',renderTable);

var ths=Q('[data-sort]');for(var i=0;i<ths.length;i++){ths[i].addEventListener('click',function(){var c=this.getAttribute('data-sort');if(c===sortCol)sortDir*=-1;else{sortCol=c;sortDir=1;}renderTable();});}

var pbs=G('pb-project-select');if(pbs)pbs.addEventListener('change',renderProjectBoard);
var pbf=G('pb-phase-filter');if(pbf)pbf.addEventListener('change',renderProjectBoard);
var cps=G('cp-client-select');if(cps)cps.addEventListener('change',renderClientPortal);
var rss=G('res-client-select');if(rss)rss.addEventListener('change',renderResults);

document.addEventListener('click',function(e){
var el=e.target.closest('[data-edit-lead]');if(el){openLeadModal(el.getAttribute('data-edit-lead'));return;}
el=e.target.closest('[data-edit-contract]');if(el){openContractModal(el.getAttribute('data-edit-contract'));return;}
el=e.target.closest('[data-edit-user]');if(el){openUserModal(el.getAttribute('data-edit-user'));return;}
el=e.target.closest('[data-edit-task]');if(el){var parts=el.getAttribute('data-edit-task').split('|');openTaskModal(parts[0],parts[1]);return;}
el=e.target.closest('[data-view-project]');if(el){G('pb-project-select').value=el.getAttribute('data-view-project');navigateTo('project-board');renderProjectBoard();return;}
el=e.target.closest('[data-create-project]');if(el){var ctId=el.getAttribute('data-create-project');var cts=getContracts(),ct=null;for(var i=0;i<cts.length;i++){if(cts[i].id===ctId){ct=cts[i];break;}}if(ct){createProjectFromContract(ct,ctId);renderAll();toast('Projeto criado para '+ct.empresa+'!');}return;}
});
}

/* ═══════════════════════════════════════
   BOOT
   ═══════════════════════════════════════ */
checkSession();

})();
</script>
</body>
</html>
