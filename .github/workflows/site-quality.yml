name: Site Quality

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: site-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/site
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Type and Astro checks
        run: npm run check

      - name: Blog audit
        run: npm run audit:blog

      - name: Blog output audit
        run: npm run audit:blog:output

      - name: Resource audit
        run: npm run audit:resources

      - name: Internal links audit
        run: npm run audit:links
